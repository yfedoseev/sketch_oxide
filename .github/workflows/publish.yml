name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true

# Least-privilege default; jobs opt into id-token below for OIDC trusted publishing.
permissions:
  contents: read

jobs:
  # Gate: nothing publishes unless the core test suite is green on this ref.
  # (fable5 doc 05 #4: the publish pipeline was decoupled from tests.)
  test-gate:
    name: Test gate (must pass before publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        working-directory: ./sketch_oxide
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: ./sketch_oxide
        run: cargo clippy --lib --all-features -- -D warnings
      - name: Tests
        working-directory: ./sketch_oxide
        run: cargo test --lib --all-features

  # Publish to crates.io (Rust) via OIDC trusted publishing (GA Jul 2025).
  publish-rust:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync versions from VERSION file
        run: ./scripts/sync-version.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        working-directory: ./sketch_oxide
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Publish to PyPI (Python) - Multi-platform wheels
  build-python-wheels:
    name: Build Python wheels
    runs-on: ${{ matrix.os }}
    needs: test-gate
    strategy:
      matrix:
        include:
          # Linux x86_64 (manylinux_2_28)
          - os: ubuntu-latest
            target: x86_64
            manylinux: manylinux_2_28
          # Linux aarch64 (manylinux_2_28)
          - os: ubuntu-latest
            target: aarch64
            manylinux: manylinux_2_28
          # Linux x86_64 musl
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          # macOS Intel
          - os: macos-latest
            target: x86_64
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64
          # Windows x86_64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4

      - name: Sync versions from VERSION file
        run: bash ./scripts/sync-version.sh
        shell: bash

      - name: Build wheels (maturin-action, manylinux/musllinux)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ./python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out ../dist
          sccache: 'true'

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/
          retention-days: 1
          if-no-files-found: warn

  # Always ship an sdist too.
  build-python-sdist:
    name: Build Python sdist
    runs-on: ubuntu-latest
    needs: test-gate
    steps:
      - uses: actions/checkout@v4
      - name: Sync versions
        run: bash ./scripts/sync-version.sh
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ./python
          command: sdist
          args: --out ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/
          retention-days: 1

  # Publish all Python wheels + sdist to PyPI via Trusted Publishing (OIDC + PEP 740 attestations).
  publish-python:
    name: Publish Python to PyPI
    runs-on: ubuntu-latest
    needs: [build-python-wheels, build-python-sdist]
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # Publish to npm (Node.js) via OIDC trusted publishing (npm classic tokens
  # were revoked Dec 2025 post-Shai-Hulud; token path is dead — doc 04 #1).
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test-gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync versions from VERSION file
        run: ./scripts/sync-version.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./nodejs
        run: npm ci

      - name: Build and publish (with provenance)
        working-directory: ./nodejs
        run: npm publish --provenance --access public

  # Publish to Maven Central (Java) — DISABLED.
  # NOTE: OSSRH/Nexus shut down 2025-06-30. When re-enabling, migrate to the
  # Central Publisher Portal + central-publishing-maven-plugin (doc 04 #7).
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    if: false  # Disabled: needs Central Portal migration + GPG secrets
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Maven publishing disabled pending Central Portal migration"

  # Publish to NuGet (C#) — DISABLED pending [LibraryImport]/trim fix (doc 04 #6).
  publish-nuget:
    name: Publish to NuGet
    runs-on: windows-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "NuGet publishing disabled pending .NET modernization"

  # Create release summary
  release-summary:
    name: Create Release Summary
    runs-on: ubuntu-latest
    needs: [publish-rust, publish-python, publish-npm]
    if: always() && !failure()
    steps:
      - name: Create release summary
        run: |
          echo "Release Publishing Summary"
          echo "=============================="
          echo "Rust (crates.io): Published (OIDC)"
          echo "Python (PyPI): Published (trusted publishing + attestations)"
          echo "Node.js (npm): Published (OIDC + provenance)"
          echo "Disabled: Java (Maven Central), C# (NuGet)"
