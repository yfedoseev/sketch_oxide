[package]
name = "sketch_oxide"
version.workspace = true
authors.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "State-of-the-art DataSketches library (2026) - UltraLogLog, Binary Fuse Filters, DDSketch, and more"

# Feature flags (fable5 doc 01 F6). The crate previously had none, so new SIMD /
# serde code had no scaffolding to slot into.
# - `std` (default): reserved toggle for a future `no_std + alloc` core.
# - `simd`: opt-in SIMD kernels behind runtime feature detection.
# - `serde`: derive (de)serialization on the public state/DTO types.
[features]
default = ["std"]
std = []
simd = []
serde = ["dep:serde"]

[dependencies]
# Hash functions for sketches
twox-hash.workspace = true  # XXHash implementation
xxhash-rust.workspace = true  # xxHash for Bloom filter
siphasher.workspace = true  # SipHash-1-3 keyed hashing (adversarially robust)
# Random number generation for sampling algorithms
rand.workspace = true
# Optional serialization support (enabled by the `serde` feature)
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
rand.workspace = true
serde_json.workspace = true

# Comparison crates for "us vs them" benchmarks
pdatastructs.workspace = true             # HyperLogLog, Count-Min, Bloom comparison (stable Rust)
probabilistic-collections.workspace = true # Bloom, Cuckoo comparison
streaming_algorithms.workspace = true     # SIMD-accelerated streaming algorithms

