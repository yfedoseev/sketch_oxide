[workspace]
members = ["sketch_oxide", "python", "nodejs", "java", "dotnet/csharp-ffi"]
resolver = "2"

# Release tuning (doc 02 finding 1 + doc 05 finding 1):
# - fat LTO + single codegen unit lets the hot hashing loops inline across
#   crates (twox-hash/xxhash-rust into sketch update paths): ~5-20% on these
#   tiny-hot-loop workloads, free on every published wheel/npm/jar.
# - overflow-checks: keep wrapping arithmetic a *decision*, not a silent
#   release-only footgun. Deserializers parse untrusted bytes; a silent
#   multiply overflow there bypassed length checks (see spline_sketch/binary_fuse).
[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[profile.bench]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Deny dangerous patterns in production
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Pedantic lints (cherry-picked for value)
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Cargo group
cargo_common_metadata = "warn"

[workspace.package]
version = "0.2.0"
authors = ["Yury Fedoseev <yfedoseev@gmail.com>"]
edition = "2021"
# Declared MSRV (fable5 doc 01 F6 / doc 04 #5). Set to the lowest version the
# code actually builds on; bump deliberately, not implicitly. Verified in CI.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yfedoseev/sketch_oxide"
keywords = ["data-structures", "probabilistic", "sketches", "cardinality", "quantiles"]
categories = ["algorithms", "data-structures", "mathematics"]

[workspace.dependencies]
# FFI bindings
jni = "0.21"
napi = { version = "3.10", features = ["napi8"] }
napi-derive = "3"
napi-build = "2.3"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-build-config = "0.29"

# Core dependencies
twox-hash = "2.0"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
siphasher = "1.0"  # SipHash-1-3 keyed hashing (HashDoS-resistant)
hex = "0.4"
rand = "0.9"
numpy = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Development and benchmarking
criterion = "0.5"
proptest = "1.4"
pdatastructs = "0.7"
probabilistic-collections = "0.7"
streaming_algorithms = "0.3"
